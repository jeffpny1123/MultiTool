<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Slides</title>
<link rel="stylesheet" href="slides.css">
<style>
#stage { display:flex; flex-direction:column; }
#tools { display:flex; align-items:center; gap:5px; padding:4px 12px 8px; border-bottom:1px solid var(--r-border); flex:none; user-select:none; overflow:hidden; white-space:nowrap; }
#tools .rb { padding:5px 9px; }
#tools .rb.on { background:var(--r-accent); border-color:var(--r-accent); color:#fff; }
#tools .fb { font-weight:700; } #tools .fi { font-style:italic; } #tools .fu { text-decoration:underline; }
#tools input[type=number] { width:58px; background:var(--r-input); color:var(--r-text); border:1px solid var(--r-border); border-radius:8px; padding:5px 6px; font:inherit; }
#tools input[type=color] { width:30px; height:30px; padding:0; border:1px solid var(--r-border); border-radius:8px; background:var(--r-card); }
#tools input:disabled { opacity:.4; }
.tsep { width:1px; height:22px; background:var(--r-border); margin:0 4px; flex:none; }
.pinfo { color:var(--r-dim); margin-right:8px; }
#work { flex:1; display:flex; min-height:0; }
#thumbs { width:190px; flex:none; overflow:auto; padding:10px 10px 30px; border-right:1px solid var(--r-border); }
.th { display:flex; gap:6px; margin-bottom:10px; cursor:pointer; border-radius:8px; padding:4px; border:2px solid transparent; }
.th .no { width:18px; text-align:right; color:var(--r-dim); font-size:12px; flex:none; }
.th canvas { width:100% !important; height:auto !important; min-width:0; flex:1; background:#fff; border-radius:4px; display:block; }
.th.on { border-color:var(--r-accent); background:var(--r-hi); }
#mid { flex:1; min-width:0; display:flex; flex-direction:column; }
#slideArea { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; overflow:hidden; background:color-mix(in srgb, var(--r-bg) 70%, #808080 8%); }
#slideWrap { position:relative; box-shadow:0 4px 22px rgba(0,0,0,.45); background:#fff; }
#slideCanvas { display:block; }
#overlay { position:absolute; inset:0; }
.shp { position:absolute; border:1px solid transparent; cursor:move; }
.shp:hover { border-color:color-mix(in srgb, var(--r-accent) 60%, transparent); }
.shp.sel { border:2px solid var(--r-accent); }
.shp .hd { display:none; position:absolute; right:-7px; bottom:-7px; width:13px; height:13px; background:var(--r-accent); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; }
.shp.sel .hd { display:block; }
.ted { position:absolute; z-index:5; background:#fff; color:#000; border:2px solid var(--r-accent); font:16px "Segoe UI","Microsoft JhengHei",sans-serif; padding:6px; resize:none; outline:none; }
#notesBar { flex:none; height:84px; border-top:1px solid var(--r-border); padding:8px 12px; }
#notesBar.off { display:none; }
#notes { width:100%; height:100%; resize:none; background:var(--r-input); color:var(--r-text); border:1px solid var(--r-border); border-radius:8px; padding:6px 8px; font:inherit; }
@media print { #app, #toast { display:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="main"><div id="stage"></div><div id="ai"></div></div>
</div>
<div id="busy"></div>
<div id="toast"></div>
<script src="strings.js"></script>
<script src="slides.js"></script>
</body>
</html>
