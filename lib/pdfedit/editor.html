<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>PDF</title>
<link rel="stylesheet" href="annot.css">
<style>
:root { --bg:#0E1014; --card:#191D26; --hi:#222836; --text:#E7EAF1; --dim:#A3ABBC; --border:#2A3040; --accent:#4F8CFF; --input:#11141A; --danger:#E5484D; --ok:#2BB673; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font:13px "Segoe UI","Microsoft JhengHei UI","Microsoft YaHei UI","Yu Gothic UI","Malgun Gothic",sans-serif; overflow:hidden; user-select:none; }
#app { display:flex; flex-direction:column; height:100%; }
.bar { display:flex; gap:6px; align-items:center; padding:8px 14px; background:var(--bg); white-space:nowrap; overflow:hidden; }
#bar1 { padding-top:10px; }
#bar2 { border-bottom:1px solid var(--border); min-height:47px; padding-top:4px; padding-bottom:10px; }
button { background:var(--card); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; white-space:nowrap; flex:none; }
button:hover { background:var(--hi); }
button:disabled { opacity:.4; cursor:default; }
button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
button.pri { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
button.ok { background:var(--ok); border-color:var(--ok); color:#fff; font-weight:600; }
/* 儲存掣 + 下箭咀選單（另存新檔 / 列印） */
.split { position:relative; display:flex; flex:none; }
.split .l { border-radius:8px 0 0 8px; }
.split .r { border-radius:0 8px 8px 0; padding:6px 7px; border-left:1px solid rgba(255,255,255,.35); }
.split .menu { position:fixed; min-width:150px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:5px; box-shadow:0 10px 28px rgba(0,0,0,.35); z-index:200; display:none; flex-direction:column; }
.split .menu.show { display:flex; }
.split .menu button { background:transparent; border:0; text-align:left; padding:8px 12px; border-radius:7px; }
.split .menu button:hover { background:var(--hi); }
.sep { width:1px; height:22px; background:var(--border); margin:0 4px; flex:none; }
.grow { flex:1; min-width:0; }
.grp { display:none; gap:6px; align-items:center; }
.grp.show { display:flex; }
.tip { color:var(--dim); overflow:hidden; text-overflow:ellipsis; }
.lbl { color:var(--dim); }
input[type=color] { width:30px; height:30px; padding:0; border:1px solid var(--border); border-radius:8px; background:var(--card); cursor:pointer; flex:none; }
select, input[type=text], textarea { background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 8px; font:inherit; }
.sw { width:26px; height:26px; border-radius:50%; border:2px solid transparent; padding:0; }
.sw.on { border-color:#fff; box-shadow:0 0 0 2px var(--accent); }
#main { flex:1; display:flex; min-height:0; }
#scroll { flex:1; overflow:auto; padding:18px 18px 60px; position:relative; }
#pages { display:flex; flex-direction:column; align-items:center; gap:18px; }
.pg { position:relative; background:#fff; box-shadow:0 4px 18px rgba(0,0,0,.45); flex:none; }
.pg canvas.pdf { position:absolute; left:0; top:0; width:100%; height:100%; }
.pg .annotationLayer { position:absolute; left:0; top:0; color:#000; user-select:text; }
.pg .layer { position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.pg .layer.cap { pointer-events:auto; }
.pg .ops { position:absolute; right:-44px; top:0; display:flex; flex-direction:column; gap:4px; opacity:0; transition:opacity .12s; }
.pg:hover .ops { opacity:1; }
.pg .ops button { width:36px; height:32px; padding:0; }
.pg .num { position:absolute; left:0; bottom:-17px; font-size:11px; color:var(--dim); }
.an { position:absolute; cursor:move; pointer-events:auto; }
.an.sel { outline:1.5px dashed var(--accent); outline-offset:2px; }
.an img { width:100%; height:100%; display:block; pointer-events:none; -webkit-user-drag:none; }
.an.text { white-space:pre; line-height:1.25; padding:2px; font-family:"Segoe UI","Microsoft JhengHei","Microsoft YaHei","Yu Gothic","Malgun Gothic",sans-serif; min-width:8px; }
.an.text[contenteditable=true] { cursor:text; outline:1.5px solid var(--accent); outline-offset:2px; user-select:text; background:rgba(79,140,255,.08); }
.an.field { border:1px solid #6b7280; background:rgba(79,140,255,.13); color:#374151; display:flex; align-items:center; overflow:hidden; font-size:11px; }
.an.field.check { justify-content:center; }
.an.field.button { background:#e5e7eb; justify-content:center; color:#111; border-color:#4b5563; }
.an.field span { padding:0 4px; pointer-events:none; white-space:nowrap; opacity:.75; }
.an .rs { position:absolute; right:-9px; bottom:-9px; width:16px; height:16px; background:var(--accent); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; display:none; }
.an .rm { position:absolute; right:-10px; top:-22px; width:20px; height:20px; line-height:17px; text-align:center; background:var(--danger); color:#fff; border-radius:50%; font-size:13px; cursor:pointer; display:none; }
.an.sel .rs, .an.sel .rm { display:block; }
.an.check .rs { display:none !important; }
input[type=number] { background:var(--input); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px 6px; font:inherit; width:62px; }
canvas.ink { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }
.drag { position:absolute; border:1.5px dashed var(--accent); pointer-events:none; }
#empty { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; gap:26px; text-align:center; padding:7vh 30px 40px; overflow:auto; }
#hero { max-width:720px; width:100%; flex:none; border-radius:22px; padding:38px 40px 34px; background:linear-gradient(135deg, color-mix(in srgb, var(--accent) 22%, var(--card)), var(--card) 62%); border:1px solid var(--border); position:relative; overflow:hidden; }
#hero::after { content:""; position:absolute; right:-70px; top:-70px; width:260px; height:260px; border-radius:50%; background:color-mix(in srgb, var(--accent) 16%, transparent); pointer-events:none; }
#hero .ico { width:76px; height:76px; border-radius:20px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:38px; background:linear-gradient(135deg, #ff6b6b, #e5484d); box-shadow:0 8px 22px rgba(229,72,77,.35); }
#hero h1 { margin:0 0 8px; font-size:26px; }
#hero p { margin:0 auto 24px; color:var(--dim); line-height:1.65; max-width:520px; font-size:13.5px; }
#eOpen { font-size:17px; padding:14px 44px; border-radius:12px; box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 45%, transparent); }
#eOpen:hover { filter:brightness(1.1); background:var(--accent); }
#hero .drop { margin-top:12px; color:var(--dim); font-size:12.5px; }
#hero .more { display:flex; gap:8px; justify-content:center; margin-top:20px; position:relative; z-index:1; }
#hero .more button { background:transparent; }
#feat { display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; max-width:720px; width:100%; flex:none; }
#feat div { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px 8px; font-size:13px; }
#feat div span { display:block; font-size:24px; margin-bottom:6px; }
#recent { max-width:720px; width:100%; text-align:left; display:none; flex:none; }
#recent .h { display:flex; align-items:center; font-size:15px; font-weight:600; margin-bottom:10px; }
#recent .h button { font-weight:400; font-size:12.5px; }
#recent .it { display:flex; align-items:center; gap:14px; background:var(--card); border:1px solid var(--border); border-radius:14px; padding:13px 16px; margin-bottom:8px; cursor:pointer; transition:transform .08s; }
#recent .it:hover { background:var(--hi); border-color:var(--accent); transform:translateY(-1px); }
#recent .it .fi { width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; background:color-mix(in srgb, var(--danger) 22%, transparent); }
#recent .it .n { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#recent .it .p { color:var(--dim); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
#recent .it .x { margin-left:auto; flex:none; width:30px; height:30px; padding:0; border-radius:50%; background:transparent; }
#recent .it .c { min-width:0; flex:1; }
#ai { width:340px; border-left:1px solid var(--border); display:none; flex-direction:column; background:var(--bg); }
#ai.show { display:flex; }
#ai .head { display:flex; align-items:center; padding:10px 12px; font-weight:600; border-bottom:1px solid var(--border); }
#ai .log { flex:1; overflow:auto; padding:12px; user-select:text; }
#ai .m { margin-bottom:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
#ai .m b { display:block; margin-bottom:2px; color:var(--accent); font-size:12px; }
#ai .m.ai b { color:var(--ok); }
#ai .m.note { color:var(--dim); font-size:12px; }
#ai .quick { display:flex; gap:6px; padding:0 12px 8px; flex-wrap:wrap; }
#ai .in { display:flex; gap:6px; padding:0 12px 12px; }
#ai textarea { flex:1; height:58px; resize:none; }
.aifiles { display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 6px; }
.aifiles:empty { display:none; }
.aichip { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:3px 9px; font-size:12px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.aichip b { cursor:pointer; color:var(--dim); font-weight:400; margin-left:2px; }
.aichip b:hover { color:var(--danger); }
#ai .in .aiclip { padding:6px 8px; align-self:flex-end; }
#mask { position:fixed; inset:0; background:rgba(0,0,0,.55); display:none; align-items:center; justify-content:center; z-index:50; }
#mask.show { display:flex; }
#dlg { background:var(--card); border:1px solid var(--border); border-radius:14px; padding:18px; width:560px; max-width:92vw; }
#dlg h3 { margin:0 0 4px; font-size:15px; }
#dlg .sub { color:var(--dim); margin-bottom:10px; }
#pad { width:100%; height:200px; background:#fff; border-radius:10px; cursor:crosshair; touch-action:none; display:block; }
#dlg .row { display:flex; gap:8px; align-items:center; margin-top:12px; flex-wrap:wrap; }
#sigs { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
#sigs .s { position:relative; background:#fff; border-radius:8px; padding:4px; cursor:pointer; border:2px solid transparent; }
#sigs .s:hover { border-color:var(--accent); }
#sigs .s img { height:46px; max-width:150px; display:block; }
#sigs .s i { position:absolute; right:-7px; top:-7px; width:18px; height:18px; line-height:16px; text-align:center; background:var(--danger); color:#fff; border-radius:50%; font-style:normal; font-size:12px; }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--hi); border:1px solid var(--border); padding:9px 16px; border-radius:10px; display:none; z-index:60; max-width:80vw; }
label.chk { display:flex; gap:6px; align-items:center; color:var(--dim); }
/* 主選單（未開檔）：淨係留「開啟 PDF」同「開新視窗」，其他工具唔顯示 */
#app.home .bar { display:none; }
/* 喺文書工具入面：首頁係文書工具嗰個，呢頁未有檔案時只顯示「載入緊」 */
body.suite #hero, body.suite #feat, body.suite #recent { display:none !important; }
body.suite #app.home .bar { display:flex; }
#wait { display:none; color:var(--dim); font-size:14px; margin-top:30vh; }
body.suite #wait { display:block; }
@media (max-width:1180px) { .bar { gap:4px; padding-left:10px; padding-right:10px; } button { padding:6px 8px; } .sep { margin:0 1px; } #zLabel { min-width:38px !important; } }
@media (max-width:1040px) { html, body { font-size:12px; } button { padding:5px 6px; } }
@media print {
  @page { margin:0; }
  html, body { overflow:visible; height:auto; background:#fff; }
  .bar, #ai, #toast, #mask, #empty, .ops, .num, .an .rs, .an .rm { display:none !important; }
  #app, #main { display:block; height:auto; }
  #scroll { overflow:visible; padding:0; }
  #pages { gap:0; display:block; }
  .pg { box-shadow:none; break-after:page; page-break-after:always; margin:0 auto; }
  .an.sel { outline:none; }
  .an.field { background:transparent; }
}
</style>
</head>
<body>
<div id="app">
  <div class="bar" id="bar1">
    <button id="bBack" style="display:none"></button>
    <button id="bOpen" class="pri"></button>
    <span class="sep"></span>
    <button data-tool="select" class="tool on"></button>
    <button data-tool="text" class="tool"></button>
    <button data-tool="sign" class="tool"></button>
    <button data-tool="image" class="tool"></button>
    <button data-tool="draw" class="tool"></button>
    <button data-tool="highlight" class="tool"></button>
    <button data-tool="whiteout" class="tool"></button>
    <button data-tool="form" class="tool"></button>
    <span class="sep"></span>
    <button id="bUndo" disabled></button>
    <button id="bRedo" disabled></button>
    <span class="grow"></span>
    <button id="zOut">−</button><span id="zLabel" style="min-width:44px;text-align:center">100%</span><button id="zIn">+</button>
    <button id="bWin" style="display:none">⧉</button>
    <button id="bAi" style="display:none">✦ AI</button>
    <div class="split"><button id="bSave" class="ok l" disabled></button><button id="bMore" class="ok r" disabled>▾</button>
      <div class="menu" id="saveMenu"><button id="bSaveAs"></button><button id="bPrint"></button></div></div>
  </div>
  <div class="bar" id="bar2">
    <div class="grp" data-for="select"><button id="bAddPdf" disabled></button><button id="bBlank" disabled></button><span class="tip" id="tSelect"></span></div>
    <div class="grp" data-for="text"><span class="lbl" id="lColor1"></span><input type="color" id="color" value="#111111"><span class="lbl" id="lSize"></span><input type="number" id="size" min="6" max="300" step="1" value="14"><span class="tip" id="tText"></span></div>
    <div class="grp" data-for="sign"><button id="bNewSig"></button><span class="tip" id="tSign"></span></div>
    <div class="grp" data-for="image"><button id="bPickImg"></button><span class="tip" id="tImage"></span></div>
    <div class="grp" data-for="draw"><span class="lbl" id="lColor2"></span><input type="color" id="penColor" value="#111111"><span class="lbl" id="lThick"></span><select id="thick"><option value="1.2"></option><option value="2.4" selected></option><option value="5"></option></select><span class="tip" id="tDraw"></span></div>
    <div class="grp" data-for="highlight"><button class="sw on" data-c="#ffe600" style="background:#ffe600"></button><button class="sw" data-c="#7CFC8A" style="background:#7CFC8A"></button><button class="sw" data-c="#ff9ecb" style="background:#ff9ecb"></button><button class="sw" data-c="#8ecbff" style="background:#8ecbff"></button><span class="tip" id="tHl"></span></div>
    <div class="grp" data-for="whiteout"><span class="tip" id="tWo"></span></div>
    <div class="grp" data-for="form"><button class="fk on" data-k="text"></button><button class="fk" data-k="multi"></button><button class="fk" data-k="check"></button><button class="fk" data-k="print"></button><button class="fk" data-k="reset"></button><span class="tip" id="tForm"></span></div>
  </div>
  <div id="main">
    <div id="scroll">
      <div id="empty">
        <div id="wait"></div>
        <div id="hero">
          <div class="ico">📄</div>
          <h1 id="eTitle"></h1><p id="eSub"></p>
          <button id="eOpen" class="pri"></button>
          <div class="drop" id="eDrop"></div>
          <div class="more"><button id="eWin" style="display:none"></button><button id="eDef" style="display:none"></button></div>
        </div>
        <div id="feat"><div><span>✍️</span><b id="ft1"></b></div><div><span>📝</span><b id="ft2"></b></div><div><span>🖍️</span><b id="ft3"></b></div><div><span>📑</span><b id="ft4"></b></div></div>
        <div id="recent"><div class="h"><span id="rTitle"></span><span class="grow"></span><button id="rClear"></button></div><div id="rList"></div></div>
      </div>
      <div id="pages"></div>
    </div>
    <div id="ai">
      <div class="head"><span id="aiTitle"></span><span class="grow"></span><button id="aiClose">✕</button></div>
      <div class="log" id="aiLog"></div>
      <div class="quick"><button id="aq1"></button><button id="aq2"></button></div>
      <div class="aifiles" id="aiFiles"></div>
      <div class="in"><button id="aiClip" class="aiclip">📎</button><textarea id="aiIn"></textarea><button id="aiSend" class="pri"></button></div>
    </div>
  </div>
</div>
<div id="mask"><div id="dlg">
  <h3 id="sTitle"></h3><div class="sub" id="sSub"></div>
  <canvas id="pad"></canvas>
  <div class="row"><button id="sClear"></button><button id="sImg"></button><label class="chk"><input type="checkbox" id="sKeep" checked><span id="sKeepT"></span></label><span class="grow"></span><button id="sCancel"></button><button id="sUse" class="pri"></button></div>
  <div class="sub" id="sSavedT" style="margin-top:14px;margin-bottom:0"></div><div id="sigs"></div>
</div></div>
<div id="toast"></div>
<input type="file" id="fPdf" accept="application/pdf,.pdf" style="display:none">
<input type="file" id="fAdd" accept="application/pdf,.pdf" style="display:none">
<input type="file" id="fImg" accept="image/png,image/jpeg,image/webp,image/gif,image/bmp" style="display:none">
<script src="strings.js"></script>
<script src="pdf-lib.min.js"></script>
<script type="module">
import * as pdfjsLib from './pdf.min.js';
pdfjsLib.GlobalWorkerOptions.workerSrc = './pdf.worker.min.js';

const L = window.L || {}, CFG = window.CFG || {};
const T = (k, ...a) => (L[k] || k).replace(/\{(\d)\}/g, (_, i) => a[+i] ?? '');
const $ = id => document.getElementById(id);
const host = window.chrome && chrome.webview ? chrome.webview : null;
const SUITE = !!(host && CFG.suite);   // 喺文書工具入面行：冇自己嘅首頁，「返回」返文書工具首頁
if (SUITE) document.body.classList.add('suite');
const post = m => { if (host) host.postMessage(m); else if (window.__post) window.__post(m); };

// ---------- 主題顏色（跟程式）----------
if (CFG.colors) for (const [k, v] of Object.entries(CFG.colors)) document.documentElement.style.setProperty('--' + k, v);

// ---------- 介面文字 ----------
const txt = { bBack:'back', bOpen:'open', bSave:'save', bPrint:'print', bSaveAs:'saveas', bUndo:'undo', bRedo:'redo', bAddPdf:'addpdf', bBlank:'blank', eTitle:'title', eSub:'dropsub', eOpen:'open', eDrop:'drop', eWin:'newwin', ft1:'sign', ft2:'form', ft3:'highlight', ft4:'addpdf',
  aiTitle:'aititle', aiSend:'aisend', aq1:'aisum', aq2:'aikey', sTitle:'sigtitle', sSub:'sigdraw', sClear:'clear', sImg:'sigimg', sKeepT:'sigsave', sCancel:'cancel', sUse:'use', sSavedT:'sigsaved',
  tSelect:'tip_select', lColor1:'color', lColor2:'color', lSize:'size', tText:'tip_text', bNewSig:'signew', tSign:'place', bPickImg:'imgpick', tImage:'place', lThick:'thick', tDraw:'tip_draw',
  tHl:'tip_box', tWo:'tip_box', tForm:'tip_form', rTitle:'recent', rClear:'recentclear' };
for (const [id, k] of Object.entries(txt)) $(id).textContent = T(k);
document.querySelectorAll('.tool').forEach(b => b.textContent = T(b.dataset.tool));
document.querySelectorAll('.fk').forEach(b => b.textContent = T('f_' + b.dataset.k));
[...$('thick').options].forEach((o, i) => o.textContent = T(['thin', 'medium', 'thicker'][i]));
$('aiIn').placeholder = T('aiask');
// AI 附件：📎 揀圖片 / 檔案、喺輸入格貼圖；問完就刪（一次性），對話亦唔會儲存
let aiFiles = [], aiHint = '';
$('aiClip').title = T('ai_attach'); $('aiClip').onclick = () => post({ t: 'ai-attach' });
aiAdd('note', '', T('ai_once'));
function aiFilesChanged(m) {
  aiFiles = m.files || []; $('aiFiles').textContent = '';
  for (const f of aiFiles) { const c = document.createElement('span'); c.className = 'aichip'; c.textContent = (f.image ? '🖼 ' : '📄 ') + f.name + ' '; const x = document.createElement('b'); x.textContent = '✕'; x.onclick = () => post({ t: 'ai-detach', name: f.name }); c.appendChild(x); $('aiFiles').appendChild(c); }
  if (m.hint && m.hint !== aiHint) aiAdd('note', '', m.hint);
  aiHint = m.hint || '';
}
$('aiIn').addEventListener('paste', e => {
  const it = [...(e.clipboardData ? e.clipboardData.items : [])].find(x => x.kind === 'file' && /^image\//.test(x.type));
  if (!it) return;
  e.preventDefault();
  const f = it.getAsFile(); if (!f || f.size > 12 * 1024 * 1024) return;
  const r = new FileReader(); r.onload = () => post({ t: 'ai-attach-data', d: String(r.result).split(',')[1] }); r.readAsDataURL(f);
});
$('bWin').title = T('newwin');

// ---------- 狀態 ----------
let sources = [];          // [{bytes, pdf, fields}]
let pages = [];            // [{id, src, idx, rot, w, h, base, annots:[]}]
let zoom = 1, tool = 'select', sel = null, pending = null, fileName = '', dirty = false, seq = 1;
let hlColor = '#ffe600', formKind = 'text';
let undo = [], redo = [];
const uid = () => 'a' + (seq++);

function snapshot() { return JSON.stringify(pages.map(p => ({ id:p.id, src:p.src, idx:p.idx, rot:p.rot, w:p.w, h:p.h, base:p.base, annots:p.annots }))); }
function mark() { undo.push(snapshot()); if (undo.length > 40) undo.shift(); redo = []; dirty = true; updBtns(); }
function restore(s) { pages = JSON.parse(s); sel = null; renderAll(); updBtns(); }
function updBtns() {

/** 裁走透明邊。 */

// ---------- 儲存 ----------
const b64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };

function textPng(a, el) {

  const K = 3, r = el.getBoundingClientRect(), w = r.width / zoom, h = r.height / zoom;
  const c = document.createElement('canvas'); c.width = Math.ceil(w * K); c.height = Math.ceil(h * K);

/** 某個來源而家嘅內容：有填過表格就叫 pdf.js 將值寫入。 */
async function srcBytes(s) {
  const src = sources[s];
  try { if (src.pdf.annotationStorage.size > 0) return await src.pdf.saveDocument(); } catch { }
  return src.bytes;
}
function isPlain() {
  // 冇改過頁面、冇加嘢：淨係填咗 PDF 自帶嘅表格
  const used = [...new Set(pages.map(p => p.src))];
  if (used.length !== 1 || used[0] < 0) return false;
  if (pages.length !== sources[used[0]].pdf.numPages) return false;

}
async function buildPdf() {

    baseSrc = first.src;
    out = await PDFDocument.load(await srcBytes(baseSrc), { ignoreEncryption: true });
    if (out.isEncrypted) throw new Error(T('encrypted'));

    if (!idxs.length) continue;
    const ld = await PDFDocument.load(await srcBytes(s), { ignoreEncryption: true });
    if (ld.isEncrypted) throw new Error(T('encrypted'));
    const cps = await out.copyPages(ld, idxs);

  }
  // 新頁面次序
  const list = pages.map(p => p.src < 0 ? null : p.src === baseSrc ? basePages[p.idx] : copied.get(p.src + ':' + p.idx));
  while (out.getPageCount() > 0) out.removePage(0);
  let form = null, fseq = 1;
  const fname = k => { for (; ;) { const n = 'rabi_' + k + '_' + (fseq++); try { form.getField(n); } catch { return n; } } };
  for (let i = 0; i < pages.length; i++) {

    if (list[i]) page.setRotation(degrees(total(p)));
    if (!p.annots.length) continue;
    const R = p.src < 0 ? 0 : total(p);
    const box = p.src < 0 ? { x: 0, y: 0, width: p.w, height: p.h } : page.getCropBox();
    const W = box.width, H = box.height;

async function save() {
  if (!pages.length) return;

  toast(T('saving'), 60000);
  try {
    const bytes = await buildPdf();
    window.__last = bytes;
    const name = (fileName.replace(/\.pdf$/i, '') || 'document').replace(/-edited$/i, '') + '-edited.pdf';
    post({ t: 'save-begin', name, size: bytes.length });

// ---------- AI ----------
function aiAdd(cls, who, text) { const d = document.createElement('div'); d.className = 'm ' + cls; if (who) { const b = document.createElement('b'); b.textContent = who; d.appendChild(b); } d.appendChild(document.createTextNode(text)); $('aiLog').appendChild(d); $('aiLog').scrollTop = 1e9; return d; }
async function docText() {
  let out = '', n = 0;
  for (const p of pages) {
    n++;
    if (p.src < 0) { out += `\n[Page ${n}] (blank)\n`; continue; }
    try {
      const pg = await sources[p.src].pdf.getPage(p.idx + 1), tc = await pg.getTextContent();
      let s = '', ly = null;
      for (const it of tc.items) { if (ly !== null && Math.abs(it.transform[5] - ly) > 2) s += '\n'; s += it.str; ly = it.transform[5]; }
      out += `\n[Page ${n}]\n` + s + '\n';
    } catch { }
    if (out.length > 45000) { out = out.slice(0, 45000) + '\n…'; break; }
  }
  return out;
}
let aiBusy = false, aiWait = null;
async function aiSend(q) {
  q = (q || $('aiIn').value).trim(); if (!q || aiBusy) return;
  if (!pages.length) { toast(T('drop')); return; }
  $('aiIn').value = ''; aiBusy = true;
  aiAdd('', T('you'), q + (aiFiles.length ? '\n📎 ' + aiFiles.map(f => f.name).join('、') : '')); aiWait = aiAdd('note', '', T('aithink'));
  post({ t: 'ai', q, pages: pages.length, text: await docText() });
}
function aiReply(text, err) {
  aiBusy = false; if (aiWait) aiWait.remove();
  if (err) { aiAdd('note', '', err); return; }
  let acts = null;
  const m = text.match(/```(?:json)?\s*(\[[\s\S]*?\])\s*```/);
  if (m) { try { acts = JSON.parse(m[1]); } catch { } text = text.replace(m[0], '').trim(); }
  if (text) aiAdd('ai', 'AI', text);
  if (acts && acts.length) { const n = applyActions(acts); if (n) aiAdd('note', '', T('aiapplied', n)); }
}
function applyActions(acts) {
  mark(); let n = 0;
  const ids = pages.map(p => p.id), at = k => pages.find(p => p.id === ids[k - 1]);   // 頁碼以改之前為準
  const pct = (p, a) => { const d = dispSize(p); return { x: d.w * (+a.x || 0) / 100, y: d.h * (+a.y || 0) / 100, w: d.w * (+a.w || 0) / 100, h: d.h * (+a.h || 0) / 100 }; };

      else if (a.op === 'field') { const p = at(a.page); if (!p || !['text', 'multi', 'check', 'print', 'reset'].includes(a.kind)) continue; const q = pct(p, a); p.annots.push({ id: uid(), type: 'field', kind: a.kind, x: q.x, y: q.y, w: a.kind === 'check' ? 14 : Math.max(20, q.w || 160), h: a.kind === 'check' ? 14 : Math.max(12, q.h || 20) }); n++; }

}

  const f = [...(e.dataTransfer.files || [])].find(x => SUITE || isPdf(x));   // 文書工具：其他種類嘅檔案交俾主程式轉去對應嘅編輯器
