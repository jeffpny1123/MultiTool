<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Office</title>
<link rel="stylesheet" href="doc.css">
<style>
:root { --r-bg:#0E1014; --r-card:#191D26; --r-hi:#222836; --r-text:#E7EAF1; --r-dim:#A3ABBC; --r-border:#2A3040; --r-accent:#4F8CFF; --r-input:#11141A; --r-danger:#E5484D; --r-ok:#2BB673; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; background:var(--r-bg); color:var(--r-text); font:13px "Segoe UI","Microsoft JhengHei UI","Microsoft YaHei UI","Yu Gothic UI","Malgun Gothic",sans-serif; overflow:hidden; }
#app { display:flex; height:100%; }
#stage { flex:1; min-width:0; position:relative; }
#root { position:absolute; inset:0; display:none; }
#app.doc #root { display:block; }
#app.doc #home { display:none; }
/* 我哋自己嘅掣（首頁、AI、第一行）；編輯器入面嘅掣用返佢自己嘅樣式 */
#app .rb { background:var(--r-card); color:var(--r-text); border:1px solid var(--r-border); border-radius:8px; padding:6px 10px; font:inherit; cursor:pointer; white-space:nowrap; flex:none; }
#app .rb:hover { background:var(--r-hi); }
#app .rb:disabled { opacity:.4; cursor:default; }
#app .rb.pri { background:var(--r-accent); border-color:var(--r-accent); color:#fff; font-weight:600; }
#app .rb.ok { background:var(--r-ok); border-color:var(--r-ok); color:#fff; font-weight:600; }
#app .rb.ghost { background:transparent; }
.grow { flex:1; min-width:0; }
/* ---------- 首頁 ---------- */
#home { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; gap:22px; text-align:center; padding:6vh 30px 40px; overflow:auto; user-select:none; }
#hero { max-width:760px; width:100%; flex:none; border-radius:22px; padding:34px 40px 30px; background:linear-gradient(135deg, color-mix(in srgb, var(--r-accent) 22%, var(--r-card)), var(--r-card) 62%); border:1px solid var(--r-border); position:relative; overflow:hidden; }
#hero::after { content:""; position:absolute; right:-70px; top:-70px; width:260px; height:260px; border-radius:50%; background:color-mix(in srgb, var(--r-accent) 16%, transparent); pointer-events:none; }
#hero .ico { width:76px; height:76px; border-radius:20px; margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:38px; background:linear-gradient(135deg, #5b9dff, #2f6fed); box-shadow:0 8px 22px rgba(47,111,237,.35); }
#hero h1 { margin:0 0 8px; font-size:26px; }
#hero p { margin:0 auto 22px; color:var(--r-dim); line-height:1.65; max-width:540px; font-size:13.5px; }
#app #hOpen { font-size:17px; padding:14px 44px; border-radius:12px; box-shadow:0 6px 18px color-mix(in srgb, var(--r-accent) 45%, transparent); position:relative; z-index:1; }
#app #hOpen:hover { filter:brightness(1.1); background:var(--r-accent); }
#hero .drop { margin-top:12px; color:var(--r-dim); font-size:12.5px; }
#hero .more { display:flex; gap:8px; justify-content:center; margin-top:18px; position:relative; z-index:1; }
#newT { max-width:760px; width:100%; text-align:left; font-size:15px; font-weight:600; flex:none; margin-bottom:-10px; }
#kinds { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; max-width:760px; width:100%; flex:none; }
.kind { background:var(--r-card); border:1px solid var(--r-border); border-radius:16px; padding:18px 14px 14px; text-align:center; }
.kind .ki { width:54px; height:54px; border-radius:15px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; font-size:27px; color:#fff; }
.kind b { display:block; font-size:15px; }
.kind small { display:block; color:var(--r-dim); margin:3px 0 12px; font-size:12px; }
.kind .acts { display:flex; gap:6px; justify-content:center; }
.kind.soon { opacity:.55; }
.kind.soon .tag { display:inline-block; border:1px solid var(--r-border); border-radius:20px; padding:5px 12px; color:var(--r-dim); font-size:12px; }
#recent { max-width:760px; width:100%; text-align:left; display:none; flex:none; }
#recent .h { display:flex; align-items:center; font-size:15px; font-weight:600; margin-bottom:10px; }
#app #recent .h .rb { font-weight:400; font-size:12.5px; }
#recent .it { display:flex; align-items:center; gap:14px; background:var(--r-card); border:1px solid var(--r-border); border-radius:14px; padding:13px 16px; margin-bottom:8px; cursor:pointer; transition:transform .08s; }
#recent .it:hover { background:var(--r-hi); border-color:var(--r-accent); transform:translateY(-1px); }
#recent .it .fi { width:40px; height:40px; border-radius:10px; flex:none; display:flex; align-items:center; justify-content:center; font-size:20px; background:color-mix(in srgb, var(--r-accent) 22%, transparent); }
#recent .it .n { font-weight:600; font-size:14.5px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#recent .it .p { color:var(--r-dim); font-size:12px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; direction:rtl; text-align:left; }
#app #recent .it .x { margin-left:auto; width:30px; height:30px; padding:0; border-radius:50%; background:transparent; }
#recent .it .c { min-width:0; flex:1; }
/* ---------- 編輯器第一行（我哋放入去嘅掣）---------- */
.rbar { display:flex; gap:6px; align-items:center; padding:0 8px 6px 10px; align-self:center; }
.rmask { position:fixed; inset:0; background:rgba(0,0,0,.5); display:flex; align-items:center; justify-content:center; z-index:20000; }
.rdlg { background:var(--r-card); color:var(--r-text); border:1px solid var(--r-border); border-radius:14px; padding:20px 22px; min-width:300px; }
.rdlg h3 { margin:0 0 12px; font-size:16px; }
.rdlg table { width:100%; border-collapse:collapse; }
.rdlg td { padding:7px 0; border-bottom:1px solid var(--r-border); }
.rdlg td:last-child { text-align:right; font-weight:600; }
.rdlg .row { display:flex; justify-content:flex-end; margin-top:16px; }
/* 儲存掣 + 下箭咀選單 */
.split { position:relative; display:flex; }
#app .split .rb.l { border-radius:8px 0 0 8px; }
#app .split .rb.r { border-radius:0 8px 8px 0; padding:6px 7px; border-left:1px solid rgba(255,255,255,.35); }
.split .menu { position:absolute; right:0; top:calc(100% + 6px); min-width:150px; background:var(--r-card); border:1px solid var(--r-border); border-radius:10px; padding:5px; box-shadow:0 10px 28px rgba(0,0,0,.35); z-index:200; display:flex; flex-direction:column; }
#app .split .menu button { background:transparent; border:0; color:var(--r-text); text-align:left; padding:8px 12px; border-radius:7px; font:inherit; cursor:pointer; white-space:nowrap; }
#app .split .menu button:hover { background:var(--r-hi); }
.ep-root { height:100%; }
/* 編輯器嘅樣式假設有基本 reset（掣冇框、冇底色）；用 :where 令佢自己嘅 class 一定贏 */
:where(.ep-root) :where(*, ::before, ::after) { box-sizing:border-box; border-width:0; border-style:solid; border-color:var(--doc-border, #e5e7eb); }
:where(.ep-root) :where(button, input, select, textarea) { font:inherit; color:inherit; margin:0; padding:0; background-color:transparent; }
:where(.ep-root) :where(button) { cursor:pointer; }
/* 深色主題：只係工具列同背景變深，頁面本身保持白紙黑字（同印出嚟一樣） */
.ep-root.dark, .ep-root.dark .ep-root { --doc-caret:#000 !important; }   /* 白紙上面嘅游標要黑色 */
.ep-root.dark .layout-page { background-color:#fff !important; color:#000 !important; filter:none !important; box-shadow:0 2px 12px rgba(0,0,0,.55) !important; }
.ep-root.dark .layout-page [data-no-color-invert], .ep-root.dark .layout-page canvas, .ep-root.dark .layout-page img, .ep-root.dark .layout-page svg, .ep-root.dark .layout-page video { filter:none !important; }
/* ---------- AI ---------- */
#ai { width:340px; flex:none; display:none; flex-direction:column; border-left:1px solid var(--r-border); background:var(--r-bg); }
#ai.show { display:flex; }
#ai .head { display:flex; align-items:center; padding:10px 12px; font-weight:600; border-bottom:1px solid var(--r-border); }
#ai .log { flex:1; overflow:auto; padding:12px; user-select:text; }
#ai .m { margin-bottom:12px; line-height:1.55; white-space:pre-wrap; word-break:break-word; }
#ai .m b { display:block; margin-bottom:2px; color:var(--r-accent); font-size:12px; }
#ai .m.ai b { color:var(--r-ok); }
#ai .m.note { color:var(--r-dim); font-size:12px; }
#ai .quick { display:flex; gap:6px; padding:0 12px 8px; flex-wrap:wrap; }
#ai .in { display:flex; gap:6px; padding:0 12px 12px; }
#ai textarea { flex:1; height:58px; resize:none; background:var(--r-input); color:var(--r-text); border:1px solid var(--r-border); border-radius:8px; padding:6px 8px; font:inherit; }
.aifiles { display:flex; flex-wrap:wrap; gap:5px; padding:0 12px 6px; }
.aifiles:empty { display:none; }
.aichip { background:var(--r-card); border:1px solid var(--r-border); border-radius:14px; padding:3px 9px; font-size:12px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.aichip b { cursor:pointer; color:var(--r-dim); font-weight:400; margin-left:2px; }
.aichip b:hover { color:var(--r-danger); }
#ai .in .aiclip { padding:6px 8px; align-self:flex-end; }
#toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:var(--r-hi); border:1px solid var(--r-border); padding:9px 16px; border-radius:10px; display:none; z-index:9999; max-width:80vw; }
#busy { position:absolute; inset:0; display:none; align-items:center; justify-content:center; background:var(--r-bg); color:var(--r-dim); font-size:14px; z-index:5; }
#busy.show { display:flex; }
@media (max-width:760px) { #kinds { grid-template-columns:repeat(2, 1fr); } }
@media print { #home, #ai, #toast { display:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="home">
      <div id="hero">
        <div class="ico">📝</div>
        <h1 id="hTitle"></h1><p id="hSub"></p>
        <button id="hOpen" class="rb pri"></button>
        <div class="drop" id="hDrop"></div>
        <div class="more"><button id="hWin" class="rb ghost" style="display:none"></button><button id="hDef" class="rb ghost" style="display:none"></button></div>
      </div>
      <div id="newT"></div>
      <div id="kinds">
        <div class="kind" data-kind="docx"><div class="ki" style="background:linear-gradient(135deg,#5b9dff,#2f6fed)">📝</div><b></b><small>.docx</small><div class="acts"><button class="rb pri new"></button><button class="rb open"></button></div></div>
        <div class="kind" data-kind="xlsx"><div class="ki" style="background:linear-gradient(135deg,#3ccf8e,#1f9d63)">📊</div><b></b><small>.xlsx</small><div class="acts"><button class="rb pri new"></button><button class="rb open"></button></div></div>
        <div class="kind" data-kind="pptx"><div class="ki" style="background:linear-gradient(135deg,#ffb054,#ef7d1a)">📽️</div><b></b><small>.pptx</small><div class="acts"><button class="rb pri new"></button><button class="rb open"></button></div></div>
        <div class="kind" data-kind="pdf"><div class="ki" style="background:linear-gradient(135deg,#ff6b6b,#e5484d)">📄</div><b></b><small>.pdf</small><div class="acts"><button class="rb pri open"></button></div></div>
      </div>
      <div id="recent"><div class="h"><span id="rTitle"></span><span class="grow"></span><button id="rClear" class="rb"></button></div><div id="rList"></div></div>
    </div>
    <div id="root"></div>
    <div id="busy"></div>
  </div>
  <div id="ai">
    <div class="head"><span id="aiTitle"></span><span class="grow"></span><button id="aiClose" class="rb">✕</button></div>
    <div class="log" id="aiLog"></div>
    <div class="quick"><button id="aq1" class="rb"></button><button id="aq2" class="rb"></button></div>
    <div class="in"><textarea id="aiIn"></textarea><button id="aiSend" class="rb pri"></button></div>
  </div>
</div>
<div id="toast"></div>
<script src="strings.js"></script>
<script src="doc.js"></script>
</body>
</html>
