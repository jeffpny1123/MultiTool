<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Sheet</title>
<link rel="stylesheet" href="sheet.css">
<style>
#stage > #univer { position:absolute; inset:0; }
/* 圖表：浮喺格仔上面（唔蓋住列號同欄名） */
#stage > #chartLayer { position:absolute; height:auto; overflow:hidden; pointer-events:none; z-index:20; }   /* Univer 嘅畫布係 z-index 8 */
.rchart { position:absolute; background:#fff; border:1px solid #c9ced8; border-radius:4px; pointer-events:auto; cursor:move; box-shadow:0 1px 4px rgba(0,0,0,.15); }
.rchart.sel { border:2px solid var(--r-accent); }
.rchart .rc-body { position:absolute; inset:8px; }
.rchart .rc-tools { position:absolute; right:6px; top:6px; display:none; gap:4px; z-index:2; }
.rchart.sel .rc-tools, .rchart:hover .rc-tools { display:flex; }
.rchart .rc-tools .rb { padding:2px 7px; background:#fff; color:#333; border-color:#c9ced8; }
.rchart .rc-hd { display:none; position:absolute; right:-7px; bottom:-7px; width:13px; height:13px; background:var(--r-accent); border:2px solid #fff; border-radius:50%; cursor:nwse-resize; }
.rchart.sel .rc-hd { display:block; }
.rhint { color:var(--r-dim); font-size:12px; margin-top:6px; line-height:1.5; }
@media print { #app, #toast { display:none !important; } }
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="main"><div id="stage"></div><div id="ai"></div></div>
</div>
<div id="busy"></div>
<div id="toast"></div>
<script src="strings.js"></script>
<script>document.write('<script src="uloc/' + ({ 'zh-Hant':1, 'zh-Hans':1, ja:1, ko:1, ru:1, es:1, 'pt-BR':1, de:1, fr:1 }[(window.CFG || {}).lang] ? window.CFG.lang : 'en') + '.js"><\/script>');</script>
<script src="sheet.js"></script>
</body>
</html>
