<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Drafting</title>
<link rel="stylesheet" href="cad.css">
<style>
#stage { display:flex; flex-direction:column; }
#tools { display:flex; align-items:stretch; padding:0 6px; border-bottom:1px solid var(--r-border); flex:none; user-select:none; overflow-x:auto; overflow-y:hidden; white-space:nowrap; scrollbar-width:thin; }
.rp { display:flex; flex-direction:column; padding:4px 8px 3px; border-right:1px solid var(--r-border); flex:none; }
.rp:last-child { border-right:0; }
.rpb { display:flex; gap:2px; align-items:flex-start; height:66px; }
.rpt { text-align:center; font-size:11px; color:var(--r-dim); padding-top:3px; }
.rcol { display:flex; flex-direction:column; gap:2px; justify-content:flex-start; }
.rrow { display:flex; gap:2px; }
.tb { width:30px; height:20.6px; display:inline-flex; align-items:center; justify-content:center; background:transparent; color:var(--r-text); border:1px solid transparent; border-radius:5px; cursor:pointer; flex:none; padding:0; font:inherit; }
.tb.big { width:auto; min-width:52px; height:66px; flex-direction:column; gap:4px; padding:5px 6px 3px; font-size:12px; border-radius:7px; }
.tb:hover { background:var(--r-hi); border-color:var(--r-border); }
.tb.on { background:var(--r-accent); border-color:var(--r-accent); color:#fff; }
#rLayer { width:150px; background:var(--r-input); color:var(--r-text); border:1px solid var(--r-border); border-radius:6px; padding:3px 6px; font:inherit; margin-bottom:4px; }
.rsel { display:flex; align-items:center; gap:6px; width:132px; text-align:left; padding:4px 8px; }
.rsel .lsw { cursor:inherit; }
#work { flex:1; display:flex; min-height:0; }
#cvWrap { flex:1; min-width:0; position:relative; overflow:hidden; background:#12151b; }
#cvWrap canvas { position:absolute; left:0; top:0; display:block; }
#cvO { cursor:none; }
#side { width:236px; flex:none; border-left:1px solid var(--r-border); overflow:auto; user-select:none; }
.shead { display:flex; align-items:center; padding:8px 10px 6px; color:var(--r-dim); font-size:12px; }
.rb.sm { padding:2px 8px; border-radius:6px; font-size:12px; }
.llist { padding:0 6px 6px; }
.lrow { display:flex; align-items:center; gap:4px; padding:3px 4px; border-radius:6px; cursor:pointer; border:1px solid transparent; }
.lrow:hover { background:var(--r-hi); }
.lrow.cur { border-color:var(--r-accent); background:color-mix(in srgb, var(--r-accent) 14%, transparent); }
.li { background:transparent; border:0; color:var(--r-text); cursor:pointer; width:22px; height:22px; padding:0; font-size:12px; border-radius:4px; flex:none; }
.li:hover { background:var(--r-card); }
.li.off { opacity:.4; }
.li.del { margin-left:auto; opacity:0; color:var(--r-dim); }
.lrow:hover .li.del { opacity:1; }
.lsw { width:16px; height:16px; border:1px solid var(--r-border); border-radius:4px; cursor:pointer; padding:0; flex:none; }
.lname { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.props { padding:0 10px 12px; }
.props .dim, .rdlg .dim { color:var(--r-dim); font-size:12px; line-height:1.5; }
.rdlg .dim { margin-top:10px; max-width:360px; }
.pt { font-weight:600; margin-bottom:6px; }
.prow { display:flex; align-items:center; gap:6px; margin-bottom:5px; }
.pl { width:76px; flex:none; color:var(--r-dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.pv { user-select:text; }
.prow input[type=text], .prow select { flex:1; min-width:0; background:var(--r-input); color:var(--r-text); border:1px solid var(--r-border); border-radius:6px; padding:3px 6px; font:inherit; }
#cmd { flex:none; border-top:1px solid var(--r-border); background:var(--r-input); font-family:Consolas,"Cascadia Mono","Microsoft JhengHei UI",monospace; font-size:12.5px; }
#hist { height:54px; overflow:auto; padding:4px 12px 0; color:var(--r-dim); line-height:1.4; user-select:text; }
#cline { display:flex; align-items:center; gap:8px; padding:4px 12px 6px; }
#cprompt { color:var(--r-accent); white-space:nowrap; max-width:70%; overflow:hidden; text-overflow:ellipsis; }
#cin { flex:1; min-width:60px; background:transparent; border:0; outline:none; color:var(--r-text); font:inherit; }
#status { flex:none; display:flex; align-items:center; gap:6px; padding:4px 12px; border-top:1px solid var(--r-border); font-size:12px; color:var(--r-dim); user-select:none; }
#coord { font-family:Consolas,monospace; min-width:170px; }
.stb { background:transparent; border:1px solid var(--r-border); color:var(--r-dim); border-radius:6px; padding:2px 9px; font:inherit; cursor:pointer; }
.stb.on { background:var(--r-accent); border-color:var(--r-accent); color:#fff; }
.crow { display:flex; gap:2px; margin-bottom:2px; }
.csw { width:18px; height:18px; border:1px solid rgba(128,128,128,.5); padding:0; cursor:pointer; border-radius:3px; }
.csw:hover, .csw.on { outline:2px solid var(--r-accent); outline-offset:1px; }
.csw.wide { width:auto; height:auto; padding:5px 12px; background:var(--r-input); color:var(--r-text); margin-bottom:8px; }
.crow.basic { margin-bottom:10px; } .crow.basic .csw { width:26px; height:26px; }
.helpg { display:flex; gap:28px; } .helpg pre { margin:0; font:12.5px/1.6 Consolas,"Microsoft JhengHei UI",monospace; }
#printArea { display:none; }
@media print {
  html, body { height:auto !important; overflow:visible !important; background:#fff !important; }
  #app, #toast, #busy, .rmask { display:none !important; }
  #printArea { display:block; } #printArea svg { display:block; }
}
</style>
</head>
<body>
<div id="app">
  <div id="bar"></div>
  <div id="main"><div id="stage"></div><div id="ai"></div></div>
</div>
<div id="busy"></div>
<div id="toast"></div>
<script src="strings.js"></script>
<script src="cad.js"></script>
</body>
</html>
